{% extends "core/base.html" %}
{% load static %}

{% block content %}

        <section class="bg-white p-6 rounded-lg shadow-md animate-fadeIn">
            <h3 class="text-2xl text-[#5A0B29] font-semibold mb-4">Modifier votre produit</h3>
            <form id="addProductForm" enctype="multipart/form-data" method="post" action = "{% url 'partner:edit_product' item.id %}" class="space-y-4">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="productName" class="block text-gray-700 mb-2">Nom du Produit</label>
                    <input type="text" value="{{item.name}}" id="productName" name="productName" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#5A0B29]">
                </div>
                <div class="mb-4">
                    <label for="productPrice" class="block text-gray-700 mb-2">Prix (XAF)</label>
                    <input type="number" value="{{item.price}}" id="productPrice" name="productPrice" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#5A0B29]">
                </div>
                <div class="mb-4">
                    <label for="productDescription" class="block text-gray-700 mb-2">Description</label>
                    <textarea id="productDescription"  name="productDescription" placeholder="Plus votre description est détaillé, plus vous avez des chances de vendre" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#5A0B29]">
                        {{item.description}}
                    </textarea>
                </div>
                    
                <div class="mb-4">
                    <div class="mb-2">
                        <img id="image1" src="{{image.image1.url}}" alt="Image principale du produit" class="w-64 h-auto  rounded-lg shadow-md">
                    </div>
                    <label for="image1" class="block text-gray-700 mb-2">Image 1(ajoutez au moins deux images)</label>
                    <input type="file" id="image1" name="image1"  required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#5A0B29]">
                    
                </div>
                <div class="mb-4">
                    <label for="image2" class="block text-gray-700 mb-2">Image 2</label>
                    <input type="file" id="image2" name="image2"  required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#5A0B29]">
                </div>
                <div>
                    <span class="bg-[#5A0B29] text-white font-bold py-2 px-4 rounded-md hover:bg-opacity-90 hover:cursor-pointer transition duration-300"><i class="fas fa-plus" ></i></span>
                </div>
                <input type="hidden" name="provider" value="company">
                

                <div>
                    <button type="submit" class="bg-[#5A0B29] text-white font-bold py-2 px-4 rounded-md hover:bg-opacity-90 transition duration-300">Sauvegarder</button>
                </div>
            </form>
        </section>

{% endblock content %}

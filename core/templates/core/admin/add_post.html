{% extends "core/admin/dashboard.html" %}
<style>
    .form-input:focus, .form-textarea:focus {
        outline: none;
        border-color: #4299e1;
        box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
    }
    .image-preview {
        max-width: 100%;
        max-height: 200px;
        object-fit: cover;
    }
</style>

{% block content %}
<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <form method = "post" action = "{% url 'core:add_post' %}" enctype="multipart/form-data" id="blogPostForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="category">
                Category
            </label>
            <select name="category" id="category" class="form-select shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight" required>
                <option value="">Select post category</option>
                <option value="business plan">Business Plan</option>
                <option value="not classified">Non Classifié</option>
                <option value="social media">Réseaux sociaux</option>
            </select>
            
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="title">
                Titre
            </label>
            <input class="form-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight" id="title" type="text" name="title" placeholder="Enter blog post title" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="leadingText">
                Leading Text
            </label>
            <textarea class="form-textarea shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight" id="leadingText" placeholder="Enter leading text" rows="3" name="leading" required></textarea>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="image">
                Image de couverture
            </label>
            <input class="form-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight" id="image" type="file" name="cover" accept="image/*">
            <img id="imagePreview" class="image-preview mt-2 hidden" src="" alt="Image preview">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="content">
                Contenu
            </label>
            <textarea id="content" class="form-textarea shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight" name="content" rows="10">
                
            </textarea>
        </div>
        <div class="flex items-center justify-between">
            <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                Publié 
            </button>
            <button class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button">
                Savauvegarder le brouillon
            </button>
        </div>
    </form>
</main>

  
<script>
 
  tinymce.init({
    selector: '#content',
    plugins: [
      // Core editing features
      'anchor', 'autolink', 'charmap', 'codesample', 'emoticons', 'image', 'link', 'lists', 'media', 'searchreplace', 'table', 'visualblocks', 'wordcount',
      // Your account includes a free trial of TinyMCE premium features
      // Try the most popular premium features until Oct 14, 2024:
      'checklist', 'mediaembed', 'casechange', 'export', 'formatpainter', 'pageembed', 'a11ychecker', 'tinymcespellchecker', 'permanentpen', 'powerpaste', 'advtable', 'advcode', 'editimage', 'advtemplate',  'mentions', 'tinycomments', 'tableofcontents', 'footnotes', 'mergetags', 'autocorrect', 'typography', 'inlinecss', 'markdown',
    ],
    toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog a11ycheck typography | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat',
    tinycomments_mode: 'embedded',
    tinycomments_author: 'Author name',
    mergetags_list: [
      { value: 'First.Name', title: 'First Name' },
      { value: 'Email', title: 'Email' },
    ],
    
  });

    document.getElementById('image').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
    });

    
</script>
{% endblock content %}

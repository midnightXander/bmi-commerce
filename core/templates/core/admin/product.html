{% extends "core/admin/dashboard.html" %}
{% block content %}
<style>
    .product-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }

    .info-group {
        margin-bottom: 15px;
    }

    .label {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 5px;
    }

    .value {
        font-size: 1.1rem;
        color: #333;
        padding: 10px;
        background: #f8f8f8;
        border-radius: 5px;
        min-height: 40px;
    }

    .description .value {
        min-height: 100px;
    }

    .images-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin: 20px 0;
    }

    .image-box {
        aspect-ratio: 1;
        background: #f8f8f8;
        border-radius: 5px;
        overflow: hidden;
        position: relative;
    }

    .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
        cursor: pointer;
    }

    .image-box img:hover {
        transform: scale(1.05);
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 2px solid #f0f0f0;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.2s ease;
    }

    button:hover {
        opacity: 0.9;
    }

    .approve {
        background: #4CAF50;
        color: white;
    }

    .reject {
        background: #f44336;
        color: white;
    }

    .return {
        background: #757575;
        color: white;
        margin-left: auto;
    }

    /* Modal for enlarged images */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal img {
        max-width: 90%;
        max-height: 90vh;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .product-info {
            grid-template-columns: 1fr;
        }

        .images-container {
            grid-template-columns: repeat(2, 1fr);
        }

        .actions {
            flex-direction: column;
        }

        .return {
            margin-left: 0;
        }

        button {
            width: 100%;
        }
    }
</style>
<div class="product-info">
    <div class="info-group">
        <div class="label">Nom du produit</div>
        <div class="value">{{item.name}}</div>
    </div>

    <div class="info-group">
        <div class="label">Fournisseur</div>
        <div class="value">{{item.provider.name}}</div>
    </div>

    <div class="info-group">
        <div class="label">Prix</div>
        <div class="value">{{item.price}} FCFA</div>
    </div>

    <div class="info-group">
        <div class="label">Date Ajouté</div>
        <div class="value">{{item.timestamp}}</div>
    </div>

    <div class="info-group description" style="grid-column: 1 / -1;">
        <div class="label">Description</div>
        <div class="value">
            {{item.description}}
        </div>
    </div>
</div>

<div class="label">Images du produit</div>
<div class="images-container mb-4">
    <div class="image-box">
        <img src="{{item.image1}}" alt="Product image 1" onclick="showImage(this.src)">
    </div>
    <div class="image-box">
        <img src="{{item.image2}}" alt="Product image 2" onclick="showImage(this.src)">
    </div>
    <div class="image-box">
        <img src="{{item.image3}}" alt="Product image 3" onclick="showImage(this.src)">
    </div>
    <div class="image-box">
        <img src="{{item.image4}}" alt="Product image 4" onclick="showImage(this.src)">
    </div>
</div>
<div class="mb-4">
<p class='opacity-0'>#</p>
</div>





<!-- Modal for enlarged images -->
<div class="modal" onclick="hideModal()">
<img id="modalImage" src="" alt="Enlarged product image">
</div>

<script>
function showImage(src) {
    const modal = document.querySelector('.modal');
    const modalImg = document.getElementById('modalImage');
    modal.style.display = 'flex';
    modalImg.src = src;
}

function hideModal() {
    document.querySelector('.modal').style.display = 'none';
}



</script>
{% endblock content %}

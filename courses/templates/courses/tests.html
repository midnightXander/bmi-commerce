<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- HEADER -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-700">Cours & Modules | Clever Life</h1>
      <a href="/" class="text-sm text-blue-600 hover:underline">Accueil</a>
    </div>
  </header>

  <!-- FILTER BAR -->
  <section class="bg-blue-50 py-6 px-6">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-4">
      <select x-model="selectedType" class="p-2 rounded border border-gray-300 bg-white text-sm">
        <option value="">Tous les types</option>
        <option>TOEFL</option>
        <option>TCF</option>
        <option>TestDaF</option>
      </select>
      <select x-model="selectedLevel" class="p-2 rounded border border-gray-300 bg-white text-sm">
        <option value="">Tous les niveaux</option>
        <option>A1</option>
        <option>B1</option>
        <option>B2</option>
        <option>C1</option>
        <option>C2</option>
      </select>
    </div>
  </section>

  <!-- COURSE LIST -->
  <section class="py-12 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-8">
    <template x-for="course in filteredCourses" :key="course.name">
      <div class="bg-white p-6 rounded-lg shadow">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-xl font-bold text-blue-800" x-text="course.name"></h2>
            <p class="text-sm text-gray-600" x-text="'Niveau : ' + course.level"></p>
          </div>
          <span class="px-3 py-1 text-xs rounded bg-blue-100 text-blue-700" x-text="course.type"></span>
        </div>

        <p class="text-sm mb-4" x-text="course.description"></p>

        <!-- MODULES -->
        <div class="space-y-2">
          <template x-for="mod in course.modules">
            <div class="bg-blue-50 p-3 rounded flex items-center justify-between">
              <span class="text-sm text-gray-800 font-medium" x-text="mod.name"></span>
              <a :href="mod.link" class="text-sm text-blue-600 hover:underline">Voir</a>
            </div>
          </template>
        </div>
      </div>
    </template>
  </section>

  <script>
    function courseFilter() {
      return {
        selectedType: '',
        selectedLevel: '',
        courses: [
          {
            name: "Prépa TOEFL Express",
            type: "TOEFL",
            level: "B2",
            description: "Cours complet pour réussir le TOEFL avec modules interactifs.",
            modules: [
              { name: "Listening", link: "TestDaf/Schreiben" },
              { name: "Reading", link: "TestDaf/Schreiben" },
              { name: "Writing", link: "TestDaf/Schreiben" },
              { name: "Speaking", link: "TestDaf/Schreiben" },
            ],
          },
          {
            name: "TestDaF Cours Complet",
            type: "TestDaF",
            level: "C1",
            description: "Préparation intensive aux quatre épreuves officielles du TestDaF.",
            modules: [
              { name: "Lesen (Lecture)", link: "TestDaf/Schreiben" },
              { name: "Hören (Écoute)", link: "TestDaf/Schreiben" },
              { name: "Schreiben (Écriture)", link: "TestDaf/Schreiben" },
              { name: "Sprechen (Oral)", link: "TestDaf/Schreiben" },
            ],
          },
          {
            name: "TCF Canada - Parcours A2-B2",
            type: "TCF",
            level: "B2",
            description: "Préparation aux exigences du TCF Canada avec simulateurs officiels.",
            modules: [
              { name: "Compréhension écrite", link: "TestDaf/Schreiben" },
              { name: "Expression écrite", link: "TestDaf/Schreiben" },
              { name: "Expression orale", link: "TestDaf/Schreiben" },
            ],
          }
        ],
        get filteredCourses() {
          return this.courses.filter(c =>
            (!this.selectedType || c.type === this.selectedType) &&
            (!this.selectedLevel || c.level === this.selectedLevel)
          );
        },
      };
    }
  </script>
